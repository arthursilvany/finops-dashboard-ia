name: Release

# Publishes the versioned public images consumed by the Deploy to Azure
# template. A Template Spec publication is optional because it requires
# customer-specific Azure OIDC configuration; GHCR publication uses only the
# repository-scoped GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable image version (for example 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      publishTemplateSpec:
        description: "Also publish the ARM template to the configured Azure Template Spec"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DASHBOARD_IMAGE: ghcr.io/arthursilvany/finops-dashboard-ia-dashboard
  MCP_IMAGE: ghcr.io/arthursilvany/finops-dashboard-ia-azure-pricing-mcp
  TEMPLATE_SPEC_NAME: finops-dashboard

jobs:
  publish-images:
    name: Publish public container images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be SemVer-like (for example 1.0.0 or 1.0.0-rc.1)."
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          for IMAGE in "$DASHBOARD_IMAGE" "$MCP_IMAGE"; do
            if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$VERSION already exists. Publish a new version instead of replacing it."
              exit 1
            fi
          done

      - name: Build and push dashboard
        uses: docker/build-push-action@v7
        with:
          context: apps/finops-dashboard
          file: apps/finops-dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.DASHBOARD_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push Azure Pricing MCP
        uses: docker/build-push-action@v7
        with:
          context: mcp/azure-pricing-mcp
          file: mcp/azure-pricing-mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.MCP_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Summary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          {
            echo "### Published container images"
            echo ""
            echo "- \`$DASHBOARD_IMAGE:$VERSION\`"
            echo "- \`$MCP_IMAGE:$VERSION\`"
            echo ""
            echo "The packages must remain public because the ARM template pulls them without registry credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-template-spec:
    name: Publish Azure Template Spec
    if: github.event_name == 'workflow_dispatch' && inputs.publishTemplateSpec
    needs: publish-images
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Recompile and verify ARM JSON
        shell: bash
        run: |
          az bicep build \
            --file infra/bicep/finops-dashboard/main.bicep \
            --outfile infra/arm/azuredeploy.json

          if ! git diff --quiet -- infra/arm/azuredeploy.json; then
            echo "::error::infra/arm/azuredeploy.json is out of date with main.bicep."
            exit 1
          fi

      - name: Publish Template Spec
        shell: bash
        run: |
          az ts create \
            --name "$TEMPLATE_SPEC_NAME" \
            --version "${{ inputs.version }}" \
            --resource-group "${{ vars.TEMPLATE_SPEC_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/arm/azuredeploy.json \
            --ui-form-definition infra/portal/createUiDefinition.json \
            --yes
