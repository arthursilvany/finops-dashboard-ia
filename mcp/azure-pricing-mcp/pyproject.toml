[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-pricing-mcp"
version = "4.1.0"
description = "A Model Context Protocol server for querying Azure retail pricing information"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jonathan Vella"},
    {name = "Nadav Ben Haim"},
    {name = "Michael Liav"}
]
# This is a vendored copy. The original authors above retain credit (see
# LICENSE for the copyright holders); the maintainer below is whoever
# maintains *this* copy and receives its bug reports.
maintainers = [
    {name = "Arthur Silvany"}
]
keywords = ["azure", "pricing", "mcp", "model-context-protocol", "cloud-costs", "cost-estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # mcp 2.0.0 removed the low-level `Server.list_tools()` decorator this
    # server is built on, so the major version is capped until it is ported.
    "mcp>=1.29.0,<2.0.0",
    "aiohttp>=3.13.5",
    "pydantic>=2.13.4",
    "cachetools>=5.5.2",
    "uvicorn>=0.52.4",
    "starlette>=0.52.1",
    "sse-starlette>=1.8.2",
    "azure-identity>=1.25.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.1",
    # aioresponses patches aiohttp internals. aiohttp 3.14 added a required
    # `stream_writer` argument to ClientResponse.__init__, which aioresponses
    # (0.7.9, latest) does not pass yet. The cap is test-only on purpose: the
    # server itself runs fine on 3.14, so production is left unconstrained.
    "aioresponses>=0.7.9",
    "aiohttp<3.14",
    "mypy>=1.20.2",
    "ruff>=0.16.4",
    "pre-commit>=3.8.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[project.urls]
# These point at the repository that vendors this package, so issue and
# documentation links resolve for the people actually consuming this copy.
# `Upstream` preserves provenance back to the project it was derived from.
Homepage = "https://github.com/arthursilvany/finops-dashboard-ia"
Repository = "https://github.com/arthursilvany/finops-dashboard-ia"
Issues = "https://github.com/arthursilvany/finops-dashboard-ia/issues"
Documentation = "https://github.com/arthursilvany/finops-dashboard-ia/tree/main/mcp/azure-pricing-mcp#readme"
Upstream = "https://github.com/jonathan-vella/apex-accelerator/tree/main/tools/mcp-servers/azure-pricing"

[project.scripts]
azure-pricing-mcp = "azure_pricing_mcp.server:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["azure_pricing_mcp*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async test",
    "integration: mark test as integration test (requires network)",
    "slow: mark test as slow running",
]
norecursedirs = [".git", ".venv", "build", "dist", "*.egg"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # Skip assert_used check for tests
